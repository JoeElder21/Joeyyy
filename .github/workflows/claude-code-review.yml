name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            Review this pull request. Follow the conventions in AGENTS.md.
            Focus on correctness, agent/specialist contract changes under
            brains/, runtime/ and schemas/, and anything that would break
            scripts/privacy_guard.py or scripts/validate_specialist_corps.py.
            Be concise and skip nitpicks.
