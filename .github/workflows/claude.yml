name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    # Deliberately not [opened, assigned]. The job condition can only recheck
    # the persistent issue title and body, so every assignment on an issue whose
    # original text mentions @claude would start another run with no new
    # request. `assigned` is only useful alongside the action's
    # assignee_trigger input, which this workflow does not set.
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when someone actually mentions @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        # Pinned to the COMMIT v1.0.99 points to, not to the tag object. `git
        # ls-remote` shows v1.0.99 is an ANNOTATED tag: the object is
        # 12310e4417c34730 and the commit it peels to (`v1.0.99^{}`) is
        # c3d45e8e941e1b2a. The workflow previously named the tag object, which
        # zizmor's ref-version-mismatch audit flagged. That is not cosmetic --
        # a tag object can be deleted and re-created pointing at different code,
        # so pinning one keeps exactly the mutability that SHA-pinning exists to
        # remove. Resolve any future bump with `git ls-remote --tags` and take
        # the `^{}` line.
        uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Deliberately no --allowedTools here. This job is reachable from
          # issue_comment on a fork PR, which runs in the base-repository
          # context with ANTHROPIC_API_KEY and a write-scoped token while Claude
          # operates on contributor-controlled code. Pre-authorizing
          # requirements.txt installs, scripts/*.py, or test discovery would let
          # a contributor run arbitrary code against those credentials by
          # editing the very files being allowed.
