name: Validate Agent 007 and Mirrored Corps

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contracts and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the official AutoGen 0.2 runtime
        run: python -m pip install -r requirements.txt
      - name: Install the validators the runtime check depends on
        # `verify_runtime_stack.enforce_schemas()` returns ([], []) when
        # jsonschema is absent -- a silent no-op indistinguishable from "every
        # schema compiled cleanly". requirements.txt supplies pydantic but not
        # jsonschema or rtoml, so in CI the JSON Schema and TOML enforcement
        # never ran and an invalid schema could merge with the step green.
        #
        # Same configured-vs-executed failure as the MCP mount job two rounds
        # earlier: the step ran, printed a report, and proved nothing.
        run: python -m pip install -r requirements/runtime-contracts.txt
      - name: Validate Agent 007 and specialist contracts
        run: |
          python scripts/privacy_guard.py
          python scripts/validate_specialist_corps.py
          python -m unittest discover -s tests -v
      - name: Verify the runtime stack
        run: python scripts/verify_runtime_stack.py

  mounts:
    name: MCP mounts (launched, not assumed)
    runs-on: ubuntu-latest
    # Its own job rather than a step in the matrix above, for two reasons: it
    # needs a dependency set the contract suite deliberately does not, and
    # probing the filesystem mount fetches an npm package -- so a registry
    # outage should name itself here rather than failing "Contracts and tests"
    # twice over on both Python versions.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the MCP contract runtime
        # Without the `mcp` package, verify_mcp_mounts.py reported every
        # offline-verifiable mount as "unverified (mcp package not installed)"
        # and still exited 0 -- so the CI step launched nothing, listed no
        # tools, and went green regardless of whether the governance and
        # filesystem servers worked at all. A verifier that cannot verify has to
        # be given what it needs or made to fail, not left reporting success.
        run: python -m pip install -r requirements/runtime-contracts.txt
      - name: Launch each offline-verifiable mount and list its tools
        # --strict: with the dependency installed above, "unverified" can only
        # mean the probe did not happen, and that is a failure rather than a
        # note in a report nobody reads.
        run: python scripts/verify_mcp_mounts.py --strict

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned to the same version the pre-commit hook uses. Installing
        # whatever is latest meant an unchanged commit could start failing on a
        # ruff release, and that a contributor's local gate and CI could
        # disagree about the same file. Bump both together or not at all.
        run: python -m pip install ruff==0.14.6
      - name: Lint agent-generated Python
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check --diff .

  connectors:
    name: APS connector harness (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: connectors/aps/package-lock.json
      - name: Install pinned connector dependencies
        working-directory: connectors/aps
        run: npm ci --ignore-scripts
      - name: Syntax-check and import-resolve the validation-gate harness
        working-directory: connectors/aps
        # `node --check` parses without executing, so it never resolves an
        # import. The APS SDKs are dynamically imported only after the
        # credential check, which means an incompatible SDK update left CI green
        # and failed first on the credentialed workstation gate.
        #
        # Importing each declared dependency here resolves its exports on a
        # credential-free path, so a breaking upstream change fails in CI where
        # it is cheap to see.
        run: |
          set -euo pipefail
          node --check src/gate.mjs
          # The exact symbols src/gate.mjs constructs, not merely "the module
          # has some exports". An SDK release can rename or drop one of these
          # while keeping the namespace nonempty, which left this job green and
          # failed first on the credentialed workstation gate -- the same
          # false-confidence this step was added to remove, one level in.
          node --input-type=module -e "
            // Verified against src/gate.mjs by grep, not assumed:
            // '@aps_sdk/autodesk-sdkmanager' is a declared dependency the gate
            // never destructures, so it is resolved but no symbol is asserted.
            // Requiring one would invent a contract the harness does not have.
            const required = {
              '@aps_sdk/authentication': ['Scopes', 'AuthenticationClient'],
              '@aps_sdk/autodesk-sdkmanager': [],
              '@aps_sdk/data-management': ['DataManagementClient'],
              '@aps_sdk/model-derivative': ['ModelDerivativeClient'],
              '@aps_sdk/oss': ['OssClient'],
            };
            for (const [name, symbols] of Object.entries(required)) {
              const mod = await import(name);
              const missing = symbols.filter((s) => mod[s] === undefined);
              if (missing.length) {
                throw new Error(\`\${name} is missing: \${missing.join(', ')}\`);
              }
              console.log(\`ok \${name} -> \${symbols.join(', ')}\`);
            }
          "
