public_repository_rule = "Configuration contains no connector identifiers, credentials, Drive identifiers, or source records."

# An entry is an integration contract, not a claim that its package, service, or
# connector is installed.  `validated` can only be set after its listed gate is
# evidenced in the target runtime.

[integrations.autogen]
repository = "microsoft/autogen"
role = "runtime_conversation_orchestration"
status = "configured_not_validated"
owner_brain = "Agent-007"
entrypoint = "agent_runtime.autogen_orchestrator:GroupChatOrchestrator"
validation_gate = "Run same-brain synthetic debate, validate every handoff with PacketGuard, and prove no opposite-brain participant is selectable."
rollback = "Remove this integration entry and agent_runtime/autogen_orchestrator.py; no runtime state is stored by this repository."

[integrations.langgraph]
repository = "langchain-ai/langgraph"
role = "lifecycle_and_cadence_state_machine"
status = "configured_not_validated"
owner_brain = "Agent-007"
validation_gate = "Prove lifecycle guards reject shadow-to-active promotion without every required evidence item and pause high-impact actions for Joe."
rollback = "Disable the adapter configuration; retain PacketGuard as the enforcement baseline."

