[[mission]]
key = "growth_experiment"
required_artifact_types = ["growth_experiment"]
agent = "jeos_reflection_forge"
mode = "growth_experiment"
trigger = "Turn this lesson into an experiment / test this change"
objective = """
From a verified lesson in the supplied evidence, design one growth experiment:
the change to try, its duration, the observable signal that decides it, and the
return path if it does not help. One experiment at a time; the design must be
falsifiable and reversible.
"""
definition_of_done = [
  "One growth_experiment artifact with change, duration, and deciding signal.",
  "The experiment traces to the lesson and evidence that motivated it.",
  "A reversal path exists and is stated.",
]
definition_of_done_ids = ["design-falsifiable", "lesson-traced", "reversal-stated"]
evidence_sources = ["drive:reflection records"]
baseline_prompt = "How long does designing a personal experiment take you by hand?"

[[mission]]
key = "life_admin_system"
required_artifact_types = ["life_system_design"]
agent = "jeos_lifestyle_systems_builder"
mode = "life_admin_system"
trigger = "Systematize this life admin / stop me re-solving this chore"
objective = """
From the supplied records of a recurring personal-admin task, produce one system
design: trigger, steps, owner, reminder cadence, and failure behavior — the
lowest-friction version that actually closes the loop. Privacy-safe by
construction: the design references record locations, never embeds their contents.
"""
definition_of_done = [
  "One life_system_design artifact covering trigger, steps, and failure behavior.",
  "The design is the smallest that closes the loop, and says what it omits.",
  "No private record content is embedded; locations are referenced instead.",
]
definition_of_done_ids = ["loop-closed", "design-minimal", "privacy-safe"]
evidence_sources = ["drive:admin records", "calendar:recurring events"]
baseline_prompt = "How long does this admin task take you each time it comes up?"

