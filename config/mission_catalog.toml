  "Opportunities with no evidence of movement are listed as dormant, not as lost.",
]
definition_of_done_ids = ["pipeline-deduped", "actions-grounded", "dormant-labeled"]
evidence_sources = ["gmail:proposal threads", "drive:proposal folders", "calendar:pursuit meetings"]
baseline_prompt = "How long does a full pipeline triage normally take you by hand?"

