key = "recovery_adjustment"
required_artifact_types = ["schedule_adjustment"]
agent = "jeos_energy_director"
mode = "recovery_adjustment"
trigger = "I'm running on empty / adjust my schedule for recovery"
objective = """
From the supplied schedule and stated energy state, produce one schedule
adjustment: what to move, shrink, or drop to restore recovery, with the
trade-off of each change stated. Supportive scheduling only — no health claims,
no diagnosis, and licensed care is named as the path for medical concerns.
"""
definition_of_done = [
  "One schedule_adjustment artifact with concrete move, shrink, or drop changes.",
  "Each change states its trade-off and what it protects.",
  "The artifact stays within scheduling; medical questions are referred out.",
]
definition_of_done_ids = ["changes-concrete", "tradeoffs-stated", "scope-nonclinical"]
evidence_sources = ["calendar:next 7 days"]
baseline_prompt = "How long does rearranging your schedule for recovery take you by hand?"

[[mission]]
key = "weekly_reflection"
required_artifact_types = ["reflection_synthesis"]
agent = "jeos_reflection_forge"
mode = "weekly_reflection"
trigger = "Reflect on my week / what did this week teach me"
objective = """
From the supplied captures — journal entries, notes, voice captures — produce
one reflection synthesis: what happened, what Joe said it meant, and candidate
lessons labeled by evidence strength. The synthesis quotes Joe's own words where
it matters and never upgrades a candidate lesson into a fact.
"""
definition_of_done = [
  "One reflection_synthesis artifact grounded in the supplied captures.",
  "Each lesson is labeled source-backed, pattern, or hypothesis.",
  "Joe's own words are preserved where the meaning depends on them.",
]
definition_of_done_ids = ["synthesis-grounded", "lessons-labeled", "voice-preserved"]
evidence_sources = ["drive:journal captures", "calendar:past 7 days"]
baseline_prompt = "How long does a weekly reflection normally take you by hand?"

[[mission]]
key = "pattern_hypothesis"
required_artifact_types = ["reflection_synthesis"]
agent = "jeos_reflection_forge"
mode = "pattern_hypothesis"
trigger = "Why does this keep happening? / find the pattern"
objective = """
From the supplied history, produce one pattern analysis: the recurring situation,
its evidenced instances, one falsifiable hypothesis about the driver, and the
observation that would test it. A hypothesis is offered as a hypothesis —
no destiny claims, no diagnosis, no certainty the record does not support.
"""
definition_of_done = [
  "One reflection_synthesis artifact citing at least three evidenced instances.",
  "Exactly one falsifiable hypothesis, with the observation that would test it.",
  "The artifact's claims stay within what the record supports.",
]
definition_of_done_ids = ["instances-cited", "hypothesis-falsifiable", "claims-bounded"]
evidence_sources = ["drive:journal captures", "calendar:relevant history"]
baseline_prompt = "How long does working through a recurring pattern take you by hand?"

