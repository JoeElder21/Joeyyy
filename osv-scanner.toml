# Triaged dependency findings.
#
# Full assessment: docs/DEPENDENCY_AUDIT_2026-07-25.md.
#
# Every entry here is an acknowledged finding with a stated reason and an expiry,
# never a silenced one. The gate stays hard: any vulnerability not listed below
# fails CI. Each is listed only because it cannot be resolved from inside this
# repository -- a dated lockfile snapshot that must not be edited, an upstream
# with no fix, or a published shrinkwrap that `overrides` cannot reach -- and
# blocking every unrelated change on a pre-existing condition would convert a
# real gate into a nuisance people learn to route around.
#
# `ignoreUntil` is the point. These expire and come back, so a triage decision
# cannot quietly become permanent by being forgotten.

[[IgnoredVulns]]
id = "PYSEC-2026-311"
ignoreUntil = 2026-08-25
reason = """chromadb 1.1.1, CVSS 9.3, no fix available upstream. Reaches this
repository only as a transitive dependency of the optional memory tier, which is
not deployed; CI installs requirements.txt alone. Because no upgrade resolves it,
this is a deployment decision for Joe rather than a version bump — see the
recommended actions in docs/DEPENDENCY_AUDIT_2026-07-25.md. Revisit at expiry or
sooner if the memory tier is deployed to the workstation."""

[[IgnoredVulns]]
id = "PYSEC-2026-2132"
ignoreUntil = 2026-08-25
reason = """click 8.2.0, CVSS 7.2, fixed in 8.3.3. This one is genuinely fixable
and should be fixed — but lock-2026-07-24.txt is a dated evidence record, and
editing pins inside a snapshot named for that date would falsify the record it
exists to be. Carry the fix into the next lockfile regeneration, which is needed
regardless: the file does not currently resolve (posthog is pinned at 7.29.0
while chromadb requires <6.0.0)."""

[[IgnoredVulns]]
id = "PYSEC-2026-2447"
ignoreUntil = 2026-08-25
reason = """diskcache 5.6.3, CVSS 5.2, no fix available upstream. Transitive via
deepeval.

REASSESSED 2026-07-25 and the original reason no longer holds. It said "in the
same undeployed tier as chromadb", which was true when the only scanned input was
lock-2026-07-24.txt. Generating requirements/lock-runtime-evaluation.txt showed
diskcache resolving into the evaluation tier -- a documented workstation install
path, not an undeployed one. So this is a real exposure on the machine that runs
evaluations, downgraded only by having no upstream fix and by that machine not
being internet-exposed.

Kept as a triage rather than a blocker because no version resolves it, but the
justification is now "no fix exists" alone, not "nothing installs it". Revisit at
expiry, or sooner if deepeval drops the dependency."""

# --- npm, connectors/relay ---
#
# These four surfaced the moment `connectors/relay/package-lock.json` was added
# to the scan. They are NOT new exposures: the lock was committed earlier and
# went unscanned because the OSV step and Dependabot both named only
# connectors/aps. Adding the relay lock closed that gap, and the gap is what had
# been hiding them.
#
# None of the four is fixable from this repository, and the reason is the same
# for three of them: `@earendil-works/pi-coding-agent` ships its own
# `npm-shrinkwrap.json`. npm honours a published shrinkwrap EXACTLY, and
# `overrides` cannot reach inside it -- verified by adding both flat and nested
# override forms and regenerating the lock from scratch with node_modules
# removed. The pinned versions did not move. The parents' declared ranges would
# accept the patched versions (minimatch asks for brace-expansion ^5.0.5,
# @google/genai for protobufjs ^7.5.4); the shrinkwrap is what forbids it.
#
# npm's own `audit fix` proposes one remedy: downgrade `agent-relay` from 11.2.0
# to 10.6.7, a semver-major move of the declared dependency. That is a
# connector decision for Joe, not a patch, and it is recorded as open in
# docs/REPO_OPTIMIZATION_2026-07-25.md.
#
# Mitigating context, not an excuse: connectors/relay is DECLARATION ONLY. Its
# package.json says so and no relay server is configured, so nothing in this
# repository executes this tree today. The day one does, these stop being
# triage.
#
# Short expiry deliberately -- one month, not the three these would get if they
# were unfixable in principle. They are fixable upstream, and the expiry is what
# forces the recheck.

[[IgnoredVulns]]
id = "GHSA-3jxr-9vmj-r5cp"
ignoreUntil = 2026-08-26
reason = """brace-expansion 5.0.6, CVSS 7.7, fixed in 5.0.7. Transitive under
@earendil-works/pi-coding-agent, whose published npm-shrinkwrap.json pins it and
which `overrides` cannot penetrate. minimatch declares ^5.0.5, so the patched
version is in range -- the shrinkwrap, not the range, is the blocker. Clears when
pi-coding-agent republishes with a refreshed shrinkwrap, or if agent-relay is
moved (a semver-major decision, recorded open)."""

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
ignoreUntil = 2026-08-26
reason = """brace-expansion 5.0.6, CVSS 7.5, fixed in 5.0.8. Same package, same
shrinkwrap, same blocker as GHSA-3jxr-9vmj-r5cp -- listed separately because a
combined entry would silence one advisory the day the other is fixed."""

