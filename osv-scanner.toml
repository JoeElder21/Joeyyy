[[IgnoredVulns]]
id = "GHSA-frvp-7c67-39w9"
ignoreUntil = 2026-08-26
reason = """@hono/node-server 1.19.15, CVSS 5.9, fixed in 2.0.5. Different
blocker from the other three: this one is a genuine RANGE conflict, not a
shrinkwrap. @modelcontextprotocol/sdk declares ^1.19.9, and 2.0.5 is a major
outside it, so forcing it would violate a compatibility constraint the SDK
states rather than merely inherits. Clears when the MCP SDK widens its range."""

